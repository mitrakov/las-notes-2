# built with Flutter 3.38.5, Dart 3.10.4, CocoaPods 1.16.2, VStudio 2022, Android Studio 2025.2.3
name: lasnotes
description: "Las Notes: offline markdown editor for iOS, MacOS, Windows and Linux"
version: 2.5.7+33

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_sqlcipher: 3.4.0         # SQLite DB with SQLCipher module
  sqflite_common_ffi: 2.3.6        # SQLite for Windows/Linux; since we're stuck with sqlite3 v2.9.4, this version (2.3.6) is MAX
  markdown_widget: 2.3.2+8         # markdown widget
  file_picker: 8.1.7               # open-file dialog (bug FIXED! see https://github.com/miguelpruivo/flutter_file_picker/issues/1934)
  scoped_model: 2.0.0              # app state management
  flutter_platform_alert: 0.8.0    # native dialogs
  native_context_menu: 0.2.2+5     # native context menu (desktop only)
  window_manager: 0.5.1            # set window title in runtime (desktop only)
  shared_preferences: 2.5.4        # local key-value storage for settings
  package_info_plus: 9.0.0         # get version, build and app name
  share_plus: 12.0.1               # share-dialog for iOS share
  receive_sharing_intent: 1.8.1    # share-to-us; https://github.com/KasemJaffer/receive_sharing_intent/issues/382 TODO: Android
  url_launcher_linux: 3.2.2        # TMP: override version of markdown_widget, https://github.com/asjqkkkk/markdown_widget/issues/243
  webdav_client: 1.2.2             # webdav client
  font_awesome_flutter: 10.12.0    # extra icons
  args: 2.7.0                      # cmd line arguments parsing
  menubar: # native menu bar for Windows/Linux; should be removed once Flutter PlatformMenuBar supports Windows/Linux
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/menubar
      ref: master

dev_dependencies:
  flutter_launcher_icons: 0.14.4   # icons generator, run: "dart run flutter_launcher_icons"

dependency_overrides:
  sqlite3: 2.9.4                   # broken API in 3.0.0; need to use 'package:sqlite3/open.dart' to manually load *.dll and *.so

flutter:
  uses-material-design: true

flutter_launcher_icons:       # dart run flutter_launcher_icons
  android: "ic_launcher"
  ios: true
  image_path: "installer/macos/appicon.png"
  macos:
    generate: true
    image_path: "installer/macos/appicon.png"
  windows:
    generate: true
    image_path: "installer/macos/appicon.png"
    icon_size: 256 # min:48, max:256, default: 48
